# Render deployment configuration
# Render runs a PERSISTENT Node.js process — Socket.IO works here.
# Vercel is serverless and kills connections after each request,
# which is why WebSocket fails on Vercel.

services:
  - type: web
    name: ubar-ride-share-backend
    runtime: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_CONNECT
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEOAPIFY_API_KEY
        sync: false
